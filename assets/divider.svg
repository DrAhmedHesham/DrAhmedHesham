<svg xmlns="http://www.w3.org/2000/svg" width="800" height="6" viewBox="0 0 800 6">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="800" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
      <stop offset="0" stop-color="#161b22" stop-opacity="0"/>
      <stop offset="0.25" stop-color="#484f58"/>
      <stop offset="0.5" stop-color="#C9D1D9"/>
      <stop offset="0.75" stop-color="#484f58"/>
      <stop offset="1" stop-color="#161b22" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-800 0" to="800 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset="0.15" stop-color="#fff" stop-opacity="1"/>
      <stop offset="0.85" stop-color="#fff" stop-opacity="1"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <mask id="m"><rect width="800" height="6" fill="url(#fade)"/></mask>
  </defs>
  <rect x="0" y="2" width="800" height="2" rx="1" fill="#6E7681" opacity="0.25" mask="url(#m)"/>
  <rect x="0" y="2" width="800" height="2" rx="1" fill="url(#g)" mask="url(#m)"/>
</svg>
